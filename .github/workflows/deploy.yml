# ============================================================================
#  .github/workflows/deploy.yml
# ----------------------------------------------------------------------------
#  Verify, then ship. Nothing reaches Railway unless the typecheck and all
#  three harnesses pass on the same commit.
#
#  WHY THE RAILWAY CLI AND NOT A MARKETPLACE ACTION
#  ------------------------------------------------
#  The "deploy to Railway" GitHub actions are third-party wrappers around an
#  old, pinned Railway CLI. Railway's own documentation deploys from CI with
#  the CLI itself - link the target, then `railway up` - so that is what this
#  workflow does. Installing @railway/cli from npm means CI gets the current
#  release instead of a frozen container tag.
#
#  ONE-TIME SETUP (repo Settings -> Secrets and variables -> Actions)
#  -----------------------------------------------------------------
#    secret  RAILWAY_TOKEN             Railway -> project -> Settings -> Tokens.
#                                      A *project* token, not an account token,
#                                      and do not set RAILWAY_API_TOKEN too:
#                                      the CLI accepts only one at a time.
#    var     RAILWAY_PROJECT_ID        Railway project id
#    var     RAILWAY_ENVIRONMENT_ID    environment id or name (e.g. production)
#    var     RAILWAY_SERVICE_ID        service id or name to deploy
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in a row would otherwise race two uploads of the same service.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc -b --noEmit

      # check-client  -> document / module syntax / DOM ids / wire protocol
      #                  / objective geometry shared with the relay
      # headless      -> physics, ballistics, weapons, objective channels
      # smoke         -> boots server.js on an isolated port and drives real
      #                  WebSocket clients through the whole protocol
      - name: Harnesses
        run: bun run check

  deploy:
    name: deploy to railway
    needs: verify
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      # Optional, consumed by the running service rather than by the workflow:
      # RAILWAY_PRIVATE_DOMAIN  - private DNS name of the service
      # RAILWAY_PROJECT_NAME    - project the service belongs to
      # RAILWAY_ENVIRONMENT_NAME - environment instance name
      # RAILWAY_SERVICE_NAME    - the service name
      # These are NOT repo secrets: the workflow does not read them, they are
      # pushed into the environment the service runs in, so Railway sets them
      # from its project, environment, and service pages and the app sees them.
      RAILWAY_PRIVATE_DOMAIN: ${{ vars.RAILWAY_PRIVATE_DOMAIN }}
      RAILWAY_PROJECT_NAME: ${{ vars.RAILWAY_PROJECT_NAME }}
      RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Railway CLI
        run: npm install --global @railway/cli

      # `npm test`-style scripts run from this package's own package.json:
      #   - install    -> `bun install --frozen-lockfile`
      #   - build      -> `bun run build` (static output in dist/, no server)
      # The Railway CLI is a *global* npm package, so it belongs in the
      # workflow itself and not in the project install phase. CI installs it
      # with `npm install --global @railway/cli` (your run printed exactly
      # that, with only the expected deprecation warnings).
      # Name what is missing instead of letting the CLI fail on an empty flag.
      - name: Check the deploy configuration
        run: |
          missing=0
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::missing repository secret RAILWAY_TOKEN"; missing=1; }
          [ -n "$RAILWAY_PROJECT_ID" ] || { echo "::error::missing repository variable RAILWAY_PROJECT_ID"; missing=1; }
          [ -n "$RAILWAY_ENVIRONMENT_ID" ] || { echo "::error::missing repository variable RAILWAY_ENVIRONMENT_ID"; missing=1; }
          [ -n "$RAILWAY_SERVICE_ID" ] || { echo "::error::missing repository variable RAILWAY_SERVICE_ID"; missing=1; }
          exit $missing

      # Railway authenticates uploads with the RAILWAY_TOKEN it finds in the
      # environment of this step. We do not `railway link` here: in an automated
      # run, `railway up` takes the project, environment and service directly
      # from the flags below, and authenticates with the RAILWAY_TOKEN secret
      # declared on this step.
      - name: Deploy Production Engine to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project "${{ variables.RAILWAY_PROJECT_ID }}" \
            --environment "${{ variables.RAILWAY_ENVIRONMENT_ID }}" \
            --service "${{ variables.RAILWAY_SERVICE_ID }}" \
            --detach
